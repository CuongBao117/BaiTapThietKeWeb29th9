<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Form Validation Exercise</title>
<link rel="stylesheet" href="Styles/cau9.css">
<script src="Scripts/jquery.min.js"></script>
<script src="Scripts/cau9.js"></script>
</head>
<body>
<h3>Personal Information</h3>
<form id="regForm" novalidate>
<table>
<tr><td class="lbl">Enter name*:</td>
    <td><input type="text" id="name"><span class="err" id="err-name"></span></td></tr>
<tr><td class="lbl">Sex*:</td>
    <td><label><input type="radio" name="sex" value="Male">Male</label>
        <label><input type="radio" name="sex" value="Female">Female</label>
        <span class="err" id="err-sex"></span></td></tr>
<tr><td class="lbl">Enter email address*:</td>
    <td><input type="text" id="email"><span class="err" id="err-email"></span></td></tr>
<tr><td class="lbl">Enter birthday (MM/DD/YYYY)*:</td>
    <td><input type="text" id="birthday" size="12"><span class="err" id="err-birthday"></span></td></tr>
<tr><td class="lbl">Enter street address (line 1)*:</td>
    <td><input type="text" id="street"><span class="err" id="err-street"></span></td></tr>
<tr><td class="lbl">Enter city*:</td>
    <td><input type="text" id="city"><span class="err" id="err-city"></span></td></tr>
<tr><td class="lbl">Select a region*:</td>
    <td><select id="region">
        <option value="">-- Select --</option>
        <option>North</option><option>Central</option><option>South</option>
        </select><span class="err" id="err-region"></span></td></tr>
<tr><td class="lbl">Enter 5-digit ZIP code*:</td>
    <td><input type="text" id="zip" size="6" maxlength="10"><span class="err" id="err-zip"></span></td></tr>
<tr><td></td>
    <td><button type="button" id="btnFinish">Finish</button>
        <button type="button" id="btnClear">Clear</button></td></tr>
</table>
</form>
<p id="success"></p>
</body>
</html>
